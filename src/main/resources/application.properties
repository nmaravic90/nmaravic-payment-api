spring.application.name=nmaravic-payment-api
# database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.schemas=public
# kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVER}
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nmaravic.payment.api.kafka
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP}
kafka.topic.in=${KAFKA_TOPIC_IN}
kafka.topic.out=${KAFKA_TOPIC_OUT}
kafka.topic.error=${KAFKA_TOPIC_IN}_ERROR
# jackson
spring.jackson.default-property-inclusion=non_null

payment.simulation.failure.rate=0.2
payment.simulation.delay=3000
